name: iOS

# 1. The Swift core against the web version's vectors (pairing and her brain), on macOS.
# 2. Compile-check the iPhone app for a generic device, unsigned.
on:
  push:
    paths: ['ios/**', 'data/**', '.github/workflows/ios.yml']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: The app's bundled data matches data/
        run: for f in ear.json ear.bin female-model.json male.json male.bin; do cmp data/$f ios/OPUlation/Resources/$f; done
      - name: swift test
        working-directory: ios
        run: |
          set -o pipefail
          swift test -c release 2>&1 | tail -40
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build OPUlation
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project OPUlation.xcodeproj -target OPUlation -sdk iphoneos \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Surface warnings and errors as annotations
        if: always()
        working-directory: ios
        run: |
          grep -E "^/.*\.swift:[0-9]+:[0-9]+: (warning|error):" build.log | sort -u | head -60 | \
            sed -E 's#^.*/(OPUlation/[^:]+):([0-9]+):[0-9]+: (warning|error): (.*)$#::\3 file=ios/\1,line=\2::\4#' || true
